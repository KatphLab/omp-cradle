# yaml-language-server: $schema=../dag.schema.json
swarm:
  name: sample-review-round-graph
  workspace: ../../../.worktrees/swarm-review-round-standalone
  mode: sequential
  target_count: 1
  model: pi/smol
  concurrency: 1
  nodes:
    reviewer:
      type: agent
      role: reviewer
      task: |
        Create review/reports if needed.
        If tracking/review-round.txt does not exist, write it with exactly "1", write review/reports/review-round.md with exactly "changes requested", then call submit_repeat_decision with action "continue".
        If tracking/review-round.txt already exists, leave it unchanged, write review/reports/review-round.md with exactly "accepted", then call submit_repeat_decision with action "complete".
