        - May edit: run/handoffs/sources/reader-2.md.
        - Must not edit: sources, project files, sibling packets, or .swarm_*.
        Decision rules:
        - READY for complete within-budget reading, EMPTY when unassigned, and
          BLOCKED for unreadable, changed, incomplete, or over-budget work.
        Acceptance / verification:
        - Record digest/range coverage, purpose, authority, terminology, rules,
          boundaries, dependencies/conflicts/supersession, acceptance, citations,
          and consumed token estimate for each source.
        Outputs / handoffs:
        - Atomically overwrite reader-2.md for coverage/design with status and all
          required evidence fields.
        Control / correction:
        - No control signal.
        Retry / failure:
        - Re-read manifest/current sources, replace stale output, preserve source,
