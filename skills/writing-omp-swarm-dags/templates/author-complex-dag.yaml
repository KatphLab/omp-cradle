        contract_version: 2
        state_version: 1
        policy: preserve

    verify_source_coverage:
      type: agent
      role: Source coverage gate
      task: |
        Outcome:
        - Gate design on complete, unique, digest-matching, within-budget source
          coverage across all eight readers.

        Inputs / read:
        - Read run/meta/request.yaml from prepare, source-assignments.yaml and all
          shard manifests from partition_sources, and reader-1.md through
          reader-8.md from the matching readers.
        - Missing, malformed, changed, or BLOCKED input fails coverage.

        Scope:
        - Inspect: only declared request, manifests, and reader packets.
        - May edit: run/reports/source-coverage.md and
          run/signals/coverage.control.yaml.
        - Must not edit: sources, project files, upstream artifacts, or .swarm_*.

        Decision rules:
        - COVERAGE_PASS only for requested/assigned/completed set equality,
          exactly one reader per source, matching digests, complete contiguous
          coverage/citations, no extras, and all shard budgets.
        - Otherwise BLOCKED; incomplete evidence is not correctable by guessing.

        Acceptance / verification:
        - Compute totals, missing/duplicate/extra sets, digest mismatches,
          per-domain coverage, and per-shard budget evidence.

        Outputs / handoffs:
        - Atomically overwrite source-coverage.md as Markdown for
          synthesize_design with status and all computed evidence.
        - Atomically overwrite coverage.control.yaml as runtime control YAML with
          action and reason; invalid or unwritable output fails this node.

        Control / correction:
        - Continue only for COVERAGE_PASS.
        - Otherwise fail with one concrete reason and no target.

        Retry / failure:
        - Re-read all current packets and replace stale outputs atomically.
        - Preserve sources, project files, and upstream evidence.
      waits_for:
        [
          read_source_shard_1,
          read_source_shard_2,
          read_source_shard_3,
          read_source_shard_4,
          read_source_shard_5,
          read_source_shard_6,
          read_source_shard_7,
          read_source_shard_8,
        ]
      control:
        signal: .omp-swarm/author-complex-dag/run/signals/coverage.control.yaml
        allowed_restart_targets: [verify_source_coverage]
      resume:
        id: verify-source-coverage
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    synthesize_design:
      type: agent
      role: Complex workflow architect
      task: |
        Outcome:
        - Produce the smallest complete, precedence-resolved, ownership-safe,
          human-reviewable design for the requested generated DAG.

        Inputs / read:
        - Read run/meta/request.yaml from prepare,
          reports/source-coverage.md from verify_source_coverage, all reader
          packets, handoffs/project-analysis.md from analyze_project, and
          handoffs/runtime-contract.md from analyze_runtime.
        - Require valid READY/COVERAGE_PASS inputs; missing, malformed,
          contradictory, or BLOCKED evidence makes design BLOCKED.

        Scope:
        - Inspect: declared sources/citations and bounded project paths only when
          claims require confirmation.
        - May edit: run/handoffs/design.md.
        - Must not edit: project files, generated DAG, upstream evidence, or
          .swarm_*.

        Decision rules:
        - READY when precedence resolves all requirements into stable IDs,
          ownership clusters, acceptance, and a supported convergent topology.
        - BLOCKED for unresolved conflicts, unsupported runtime needs, unsafe
          ownership, placeholders, or missing authority.

        Acceptance / verification:
        - Prove requirement-to-node traceability, source-before-mutation order,
          disjoint writers, serialized convergence, meaningful independent
          audits, Bash interpretation, terminal acceptance, correction
          reachability, and expected waves.
        - For every node define ordered agent task sections or Bash/graph review
          contracts, exact paths/handoffs, and deliberate resume behavior.

        Outputs / handoffs:
        - Atomically overwrite design.md as Markdown for author_dag and audits.
        - Include status, requirement traceability, confirmed ownership, node
          contracts, edges/waves, workspace, commands, concurrency rationale,
          restart targets, generated path/overwrite policy, and blockers.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read all current evidence and replace stale design atomically.
        - Preserve project/generated files and leave actionable BLOCKED evidence.
      waits_for: [verify_source_coverage, analyze_project, analyze_runtime]
      resume:
        id: synthesize-design
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    author_dag:
      type: agent
      role: OMP swarm DAG implementer
      task: |
        Outcome:
        - Atomically author the complete standalone requested workflow at
          .omp/generated-complex-task.yaml and report its traceability.

        Inputs / read:
        - Read run/meta/request.yaml from prepare, runtime-contract.md from
          analyze_runtime, and design.md from synthesize_design.
        - Require READY design, fixed generated path, and prepare-approved
          overwrite policy/digest; missing, malformed, or BLOCKED input forbids
          generated-DAG edits.

        Scope:
        - Inspect: declared inputs, target path, and valid schema path/URI when
          available.
        - May edit: .omp/generated-complex-task.yaml and
          run/handoffs/authoring.md.
        - Must not edit: project source, persistent inputs, sibling artifacts,
          unrelated work, or .swarm_*.

        Decision rules:
        - Not applicable.

        Acceptance / verification:
        - Confirm supported closed fields, explicit edges, safe workspace/name/
          concurrency, no placeholders, ordered agent task sections, Bash/graph
          review contracts, exact producer/consumer handoffs, correction
          reachability, and deliberate unique resume contracts.
        - Use exact request commands and parseable markers; every meaningful Bash
          result must have an interpreting agent.

        Outputs / handoffs:
        - Atomically create or authorized-digest-replace the generated YAML for
          validators and audits; failure leaves no partial file.
        - Atomically overwrite authoring.md as Markdown with requirement coverage,
          ownership, evidence paths, expected waves, blockers, and generated
          digest for downstream audits.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current target and inputs; repair idempotently without
          duplicating content.
        - Preserve target on BLOCKED/digest mismatch and record actionable
          blockers in authoring.md.
      waits_for: [synthesize_design]
      resume:
        id: author-dag
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    validate_initial:
      type: bash
      command: |
        omp-swarm validate .omp/generated-complex-task.yaml
        status=$?
        printf '\nVALIDATION_EXIT=%s\n' "$status"
        exit "$status"
      output_path: .omp-swarm/author-complex-dag/run/reports/validation-initial.txt
      cwd: .
      waits_for: [author_dag]
      resume:
        id: validate-initial
        contract_version: 1
        state_version: 1
        policy: inputs-unchanged

    audit_traceability:
      type: agent
      role: Independent requirement and source coverage auditor
      task: |
        Outcome:
        - Independently decide whether the generated DAG completely and faithfully
          traces every controlling source requirement to production and acceptance.

        Inputs / read:
        - Read canonical request/source packets/coverage/project analysis/design,
          authoring.md from author_dag, validation-initial.txt from
          validate_initial, and the actual generated DAG.
        - Missing, malformed, stale, or contradictory evidence is BLOCKER.

        Scope:
        - Inspect: cited source/project paths and generated DAG.
        - May edit: run/reports/audit-traceability.md.
        - Must not edit: generated DAG, project files, upstream artifacts, or
          .swarm_*.

        Decision rules:
        - PASS only for complete cited precedence, stable traceability, boundary
          coverage, producers, and independent acceptance.
        - Otherwise actionable FINDINGS when repair_dag owns the correction, or
          BLOCKER for missing authority/out-of-scope change.

        Acceptance / verification:
        - Compare actual DAG to every requirement; reject invented scope,
          omissions, summary-only review, and uncited decisions.

        Outputs / handoffs:
        - Atomically overwrite audit-traceability.md for repair_dag with status
          and exact source IDs, citations, paths, node IDs, observed/required
          behavior, focused acceptance, and correction ownership.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current generated DAG and evidence; replace stale report.
        - Remain read-only and leave actionable BLOCKER evidence on failure.
      waits_for: [validate_initial]
      resume:
        id: audit-traceability
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    audit_scheduling:
      type: agent
      role: Independent scheduling and path-safety auditor
      task: |
        Outcome:
        - Independently decide whether the generated DAG is schema-supported,
          path-safe, ownership-safe, schedulable, and correctable.

        Inputs / read:
        - Read design.md, runtime-contract.md, validation-initial.txt, generated
          DAG, installed skill references, and accessible schema.
        - Missing, malformed, stale, or contradictory evidence is BLOCKER.

        Scope:
        - Inspect: declared runtime authority and generated DAG only.
        - May edit: run/reports/audit-scheduling.md.
        - Must not edit: generated DAG, project files, upstream artifacts, or
          .swarm_*.

        Decision rules:
        - PASS only when every structural/runtime predicate below holds.
        - Otherwise actionable FINDINGS when repair_dag owns the correction, or
          BLOCKER when authority/scope prevents safe repair.

        Acceptance / verification:
        - Verify closed fields; ordered agent tasks; Bash/graph contracts;
          workspace, edges/waves/concurrency; disjoint path/evidence writers;
          handoffs; Bash interpretation; control ancestry/correction reachability;
          bounded rewind; resume contracts; and idempotence.

        Outputs / handoffs:
        - Atomically overwrite audit-scheduling.md for repair_dag with status,
          evidence, failed predicates, required mutations, owners, and targets.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current DAG/runtime evidence and replace stale report.
        - Remain read-only and leave actionable BLOCKER evidence.
      waits_for: [validate_initial]
      resume:
        id: audit-scheduling
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    audit_scale_and_recovery:
      type: agent
      role: Independent large-task operability auditor
      task: |
        Outcome:
        - Independently decide whether the generated workflow is operable at the
          requested scale and can recover without blind or unreachable retries.

        Inputs / read:
        - Read canonical request, design.md, validation-initial.txt, and generated
          DAG; missing, malformed, stale, or contradictory evidence is BLOCKER.

        Scope:
        - Inspect: declared request/design and generated DAG only.
        - May edit: run/reports/audit-scale-and-recovery.md.
        - Must not edit: generated DAG, project files, upstream artifacts, or
          .swarm_*.

        Decision rules:
        - PASS only for bounded contexts, useful fan-out/fan-in, independent
          review, explicit handoffs, deterministic evidence, safe reruns, and
          reachable correction of every restart predicate.
        - Otherwise FINDINGS for repair-owned defects or BLOCKER for missing
          evidence, authority conflict, ownership overlap, or out-of-scope work.

        Acceptance / verification:
        - Stress-review source partitioning, overload/fragmentation, actual-tree
          review, writer self-approval, resume ID/version/policy/evidence limits,
          terminal failures, and the exact correction suffix.

        Outputs / handoffs:
        - Atomically overwrite audit-scale-and-recovery.md for repair_dag with
          status, evidence, failed predicates, required mutations, owners, and
          reachable targets.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current DAG/evidence and replace stale report.
        - Remain read-only and leave actionable BLOCKER evidence.
      waits_for: [validate_initial]
      resume:
        id: audit-scale-and-recovery
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    repair_dag:
      type: agent
      role: Bounded generated-DAG remediation specialist
      task: |
        Outcome:
        - Repair every confirmed in-scope generated-DAG defect, or produce an
          explicit NO-OP/BLOCKED disposition without widening scope.

        Inputs / read:
        - Read canonical request, project/runtime analyses, design.md, authoring.md,
          all three audits, validation-initial.txt, latest final-decision.md when
          present, and current generated DAG.
        - Missing/malformed authority or irreconcilable evidence is BLOCKED.

        Scope:
        - Inspect: declared inputs and current generated DAG.
        - May edit: .omp/generated-complex-task.yaml and run/reports/repair.md.
        - Must not edit: project source, inputs, sibling reports, unrelated work,
          or .swarm_*.

        Decision rules:
        - Apply only confirmed findings fixable in the generated DAG within the
          approved design envelope; reject stale/incorrect findings.
        - BLOCKED for required edits elsewhere, missing source evidence,
          irreconcilable requirements, request drift, or unsafe widening.

        Acceptance / verification:
        - Recheck every disposition against current DAG, controlling requirement,
          ordered task/node contracts, ownership, handoffs, resume behavior, and
          expected waves.

        Outputs / handoffs:
        - Atomically repair the generated YAML for validate_final/acceptance.
        - Atomically overwrite repair.md with status, finding dispositions, exact
          fixes, requirement IDs, evidence, blockers, or explicit NO-OP.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current files/latest final decision; prior edits remain.
        - Preserve correct content, apply only missing fixes, and remain
          idempotent; never leave partial output.
      waits_for:
        [audit_traceability, audit_scheduling, audit_scale_and_recovery]
      resume:
        id: repair-dag
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    validate_final:
      type: bash
      command: |
        omp-swarm validate .omp/generated-complex-task.yaml
        status=$?
        printf '\nVALIDATION_EXIT=%s\n' "$status"
        exit "$status"
      output_path: .omp-swarm/author-complex-dag/run/reports/validation-final.txt
      cwd: .
      waits_for: [repair_dag]
      resume:
        id: validate-final
        contract_version: 1
        state_version: 1
        policy: inputs-unchanged

    semantic_acceptance:
      type: agent
      role: Independent generated-workflow semantic reviewer
      task: |
        Outcome:
        - Independently decide whether the current generated DAG semantically
          satisfies the request and all human-reviewable workflow contracts.

        Inputs / read:
        - Read request, source evidence, design.md, all audits, repair.md, and
          actual generated DAG; missing/malformed/stale evidence is BLOCKER.

        Scope:
        - Inspect: cited source/project paths and generated DAG.
        - May edit: run/reports/semantic-acceptance.md.
        - Must not edit: generated DAG, project files, upstream artifacts, or
          .swarm_*.

        Decision rules:
        - PASS only when every semantic predicate below holds with no finding.
        - Otherwise actionable FINDINGS for repair-owned defects or BLOCKER for
          missing authority/out-of-envelope correction.

        Acceptance / verification:
        - Recheck source coverage/precedence, blocker handling, ordering,
          ownership/convergence, ordered task and Bash/graph contracts, handoffs,
          bounded public callers, independent acceptance, resume behavior, and
          idempotent reachable correction.

        Outputs / handoffs:
        - Atomically overwrite semantic-acceptance.md for final_decision with
          PASS, actionable FINDINGS, or BLOCKER plus concrete reproduction and
          correction ownership.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current DAG/evidence and replace stale report.
        - Remain read-only and preserve all non-owned files.
      waits_for: [repair_dag]
      resume:
        id: semantic-acceptance
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    validation_acceptance:
      type: agent
      role: Swarm validation evidence reviewer
      task: |
        Outcome:
        - Independently interpret final validator output and generated-DAG waves
          as PASS, actionable FINDINGS, or BLOCKER.

        Inputs / read:
        - Read design.md, repair.md, validation-final.txt from validate_final, and
          actual generated DAG.
        - Require one VALIDATION_EXIT marker, validator result, and printed waves;
          missing, malformed, stale, duplicate, or contradictory evidence is not
          success.

        Scope:
        - Inspect: declared inputs and generated DAG.
        - May edit: run/reports/validation-acceptance.md.
        - Must not edit: generated DAG, project files, validator output, or
          .swarm_*.

        Decision rules:
        - PASS only for VALIDATION_EXIT=0, `Validation: ok`, design-matching
          dependency/ownership waves, intended workspace, and no unsafe path or
          placeholder.
        - Otherwise FINDINGS for repair-owned DAG defects or BLOCKER for
          unavailable/malformed authority.

        Acceptance / verification:
        - Parse the marker/result/waves and compare them to current design and DAG;
          command execution or file existence alone is insufficient.

        Outputs / handoffs:
        - Atomically overwrite validation-acceptance.md for final_decision with
          status, marker, waves, findings, evidence, and correction ownership.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current final output/DAG and replace stale report.
        - Remain read-only and preserve upstream evidence.
      waits_for: [validate_final]
      resume:
        id: validation-acceptance
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    final_decision:
      type: agent
      role: Final generated-DAG acceptance controller
      task: |
        Outcome:
        - Emit exactly one terminal acceptance, reachable repair restart, or safe
          failure decision for the current generated DAG.

        Inputs / read:
        - Read request, design.md, repair.md, semantic-acceptance.md from
          semantic_acceptance, validation-acceptance.md from
          validation_acceptance, latest prior final-decision.md, and actual DAG.
        - Missing, malformed, stale, or contradictory evidence cannot continue.

        Scope:
        - Inspect: declared reports and current generated DAG.
        - May edit: run/reports/final-decision.md and
          run/signals/final.control.yaml.
        - Must not edit: generated DAG, project files, upstream artifacts, or
          .swarm_*.

        Decision rules:
        - ACCEPT only when both acceptance reports PASS, validation is current and
          zero, every requirement is traced, and no blocker remains.
        - CORRECT only for a confirmed defect fixable solely by repair_dag.
        - FAIL for missing evidence, unresolved conflict, unsafe/out-of-envelope
          correction, request drift, or exhausted correction scope.

        Acceptance / verification:
        - Verify both reports against current DAG/source evidence and prove the
          selected restart target owns every required mutation.

        Outputs / handoffs:
        - Atomically overwrite final-decision.md with verdict, evidence, findings,
          required mutations, owner/target, and reason for the operator.
        - Write final.control.yaml last as exactly one valid runtime decision;
          failure to produce both valid outputs fails this node.

        Control / correction:
        - Continue only for ACCEPT.
        - Restart only target repair_dag for CORRECT; its suffix contains the
          generated-DAG writer, final validator, and both acceptance branches.
        - Fail for every FAIL predicate; never restart preparation, source reading,
          synthesis, or audits.

        Retry / failure:
        - Re-read current DAG/latest evidence because prior edits persist.
        - Supersede stale findings and atomically replace both owned outputs.
      waits_for: [semantic_acceptance, validation_acceptance]
      control:
        signal: .omp-swarm/author-complex-dag/run/signals/final.control.yaml
        allowed_restart_targets: [repair_dag]
      resume:
        id: final-decision
        contract_version: 2
        state_version: 1
        policy: never
