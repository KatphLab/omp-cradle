swarm:
  name: author-complex-dag
  workspace: ..
  mode: parallel
  target_count: 1
  concurrency: 4
  restart_policy:
    max_restarts: 2
    max_restarts_per_target: 2
    max_node_attempts: 3
  nodes:
    prepare:
      type: agent
      role: Portable DAG authoring workspace guard
      task: |
        Outcome:
        - Validate the existing project, canonical authoring request, source
          budget, ownership, commands, and fixed generated-DAG destination before
          preparing this run.

        Inputs / read:
        - Read .omp-swarm/author-complex-dag/input/request.yaml and
          .omp/author-complex-dag.yaml from the existing project.
        - Require the complete request contract defined by
          templates/author-complex-dag-request.yaml: goal/completion, unique
          workspace-relative source records with authority/status/token estimates,
          eight-shard budget, precedence, inspection/mutable/forbidden paths,
          ownership clusters/convergence, exact acceptance commands, anchors,
          constraints, and generated_dag.
        - Reject missing/malformed inputs, duplicate IDs, path/symlink escapes,
          vague commands, invalid ownership, overlap, missing convergence owner or
          precedence, over-budget corpus, and any generated path other than
          .omp/generated-complex-task.yaml.

        Scope:
        - Inspect: the request, declared anchors/sources, fixed generated path,
          and literal .omp-swarm/author-complex-dag/run/.
        - May edit: only .omp-swarm/author-complex-dag/run/.
        - Must not edit: project source, persistent input/, .git, generated DAG,
          user work, or runtime-owned .swarm_*.

        Decision rules:
        - READY only when workspace is the YAML's existing parent, all anchors and
          request contracts pass, the corpus fits, and generated_dag is safe.
        - Under fail-if-exists, an existing generated DAG is BLOCKED.
        - Under replace-matching-sha256, any digest mismatch is BLOCKED.

        Acceptance / verification:
        - Re-resolve every accepted path beneath the canonical workspace and
          verify source, anchor, and prior-output digests before cleanup.
        - READY requires recreated meta/, handoffs/, reports/, and signals/.

        Outputs / handoffs:
        - Atomically overwrite run/meta/request.yaml as canonical YAML with
          accepted source, anchor, and prior-output digests for every downstream
          node.
        - Atomically overwrite run/signals/prepare.control.yaml as control YAML
          with action and reason for the runtime.

        Control / correction:
        - Continue only for READY with reason: authoring request and existing
          workspace verified.
        - Otherwise fail with one concrete safe reason and no target.

        Retry / failure:
        - Revalidate before deleting only the literal run/ subtree.
        - Preserve project, input, generated output, and runtime state on failure;
          create only run/signals/ when needed to emit the fail decision.
        - Never emit a second decision.
      control:
        signal: .omp-swarm/author-complex-dag/run/signals/prepare.control.yaml
        allowed_restart_targets: [prepare]
      resume:
        id: prepare
        contract_version: 2
        state_version: 1
        policy: preserve

    partition_sources:
      type: agent
      role: Complete-source assignment planner
      task: |
        Outcome:
        - Assign every canonical source exactly once across eight bounded,
          semantically coherent reader shards.

        Inputs / read:
        - Read run/meta/request.yaml from prepare as canonical YAML.
        - Require eight shards, positive max_estimated_tokens_per_shard, and
          complete unique source records; malformed input is BLOCKED.

        Scope:
        - Inspect: canonical source metadata only.
        - May edit: run/handoffs/source-shard-1.yaml through
          source-shard-8.yaml and source-assignments.yaml.
        - Must not edit: source documents, project files, sibling artifacts, or
          .swarm_*.

        Decision rules:
        - READY when set equality, unique whole-document assignment, and every
          shard budget hold; empty shards are valid.
        - BLOCKED when any source or total corpus cannot fit; never omit,
          truncate, split across readers, or silently exceed the limit.

        Acceptance / verification:
        - Prove requested/assigned set equality, unique assignment, expected
          digests, domains, authority, per-source estimates, and shard totals.

        Outputs / handoffs:
        - Atomically overwrite eight YAML shard manifests for their matching
          readers and source-assignments.yaml for verify_source_coverage.
        - Include status, source IDs, digests, domains, authority, estimates, and
          totals; on BLOCKED include the exact overload.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read the canonical request and atomically replace all nine manifests.
        - Preserve sources and project files; leave actionable BLOCKED evidence.
      waits_for: [prepare]
      resume:
        id: partition-sources
        contract_version: 2
        state_version: 1
        policy: preserve

    analyze_project:
      type: agent
      role: Project architecture and ownership analyst
      task: |
        Outcome:
        - Confirm project architecture, ownership clusters, convergence owners,
          dependency order, and focused checks inside the request envelope.

        Inputs / read:
        - Read run/meta/request.yaml from prepare and directly applicable project
          guidance.
        - Missing or malformed ownership, scope, anchors, or commands is BLOCKED.

        Scope:
        - Inspect: only request.inspection_paths and bounded references/callers.
        - May edit: run/handoffs/project-analysis.md.
        - Must not edit: project files, generated DAG, sibling artifacts, or
          .swarm_*.

        Decision rules:
        - READY when clusters match actual dependencies, same-wave paths are
          disjoint, and every convergence path has one later owner.
        - BLOCKED on mismatch; never invent checks, clusters, or wider scope.

        Acceptance / verification:
        - Verify conventions, public callers, generated outputs, dependency order,
          mutable bounds, and command-generated paths against current project.

        Outputs / handoffs:
        - Atomically overwrite project-analysis.md as Markdown for
          synthesize_design with status, ownership, dependencies, convergence
          owners, focused verification, and blockers.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current project references and replace stale analysis.
        - Preserve project and generated files; leave actionable BLOCKED evidence.
      waits_for: [prepare]
      resume:
        id: analyze-project
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    analyze_runtime:
      type: agent
      role: OMP swarm runtime contract analyst
      task: |
        Outcome:
        - Produce the source-grounded OMP swarm runtime contract required to
          design, author, validate, review, and resume the generated DAG.

        Inputs / read:
        - Read run/meta/request.yaml from prepare, the installed
          writing-omp-swarm-dags skill and routed references, plus accessible
          omp-swarm help and schema.
        - Missing required runtime authority is BLOCKED; never invent fields.

        Scope:
        - Inspect: installed swarm skill, schema/help, and requested workflow
          features only.
        - May edit: run/handoffs/runtime-contract.md.
        - Must not edit: project files, generated DAG, sibling artifacts, or
          .swarm_*.

        Decision rules:
        - READY only when every requested feature maps to supported semantics.
        - BLOCKED when required schema/runtime behavior cannot be established.

        Acceptance / verification:
        - Cover workspace, edges/waves, concurrency, Bash settlement/output,
          imports, control ancestry/restart, persistent files, resume
          identity/version/policy/evidence, closed node schemas, and validation.
        - Require ordered task sections; record that task headings are unparsed,
          edges do not transport data/prove success, Bash non-zero settles, and
          rewind/restart does not restore files.

        Outputs / handoffs:
        - Atomically overwrite runtime-contract.md as Markdown for
          synthesize_design, author_dag, and audits.
        - Include supported fields/semantics, task and node-type contracts, exact
          validation command, resume rules, and anti-patterns.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read current installed authority and replace stale output.
        - Preserve all project files and report missing authority actionably.
      waits_for: [prepare]
      resume:
        id: analyze-runtime
        contract_version: 2
        state_version: 1
        policy: inputs-unchanged

    read_source_shard_1:
      type: agent
      role: Complete source reader one
      task: |
        Outcome:
        - Produce complete cited evidence for every source assigned to reader 1.

        Inputs / read:
        - Read source-shard-1.yaml from partition_sources and every listed source
          from start through end; malformed manifest or changed source is BLOCKED.

        Scope:
        - Inspect: only assigned source paths.
        - May edit: run/handoffs/sources/reader-1.md.
        - Must not edit: sources, project files, sibling packets, or .swarm_*.

        Decision rules:
        - READY for complete within-budget reading or EMPTY when unassigned.
        - BLOCKED for unreadable, digest-changed, incomplete, or over-budget work.

        Acceptance / verification:
        - Record digest, complete range ledger, purpose, authority, terminology,
          rules/boundaries, dependencies/conflicts/supersession, acceptance,
          exact citations, and consumed token estimate for each source.

        Outputs / handoffs:
        - Atomically overwrite reader-1.md as Markdown for verify_source_coverage
          and synthesize_design with READY, EMPTY, or BLOCKED plus required fields.

        Control / correction:
        - No control signal.

        Retry / failure:
        - Re-read the manifest and complete sources; replace stale packet.
        - Never resolve conflicts by preference or promote examples to rules.
      waits_for: [partition_sources]
      resume:
        id: read-source-shard-1
        contract_version: 2
        state_version: 1
        policy: preserve

    read_source_shard_2:
      type: agent
      role: Complete source reader two
